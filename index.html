<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Homewater</title>
    <meta name="description" content="Homewater: live one sockeye salmon's whole life, then carry on as its offspring." />
    <meta name="theme-color" content="#0c2a31" />
    <!-- Link previews. og:image is absolute because most link scrapers ignore relative paths;
         the file itself ships with the build (public/og-image.jpg). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Homewater" />
    <meta property="og:title" content="Homewater: life as a sockeye salmon" />
    <meta property="og:description" content="A free browser game. Live one sockeye salmon's whole life, from an egg in the gravel to spawning years later, then carry on as one of its offspring." />
    <meta property="og:url" content="https://ajacobscoldcall-boop.github.io/homewater/" />
    <meta property="og:image" content="https://ajacobscoldcall-boop.github.io/homewater/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sockeye salmon swimming toward a pink swarm of krill in the open ocean" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="vignette"></div>
      <div id="flash"></div>
      <div id="hud" hidden>
        <div id="hud-top">
          <div id="hud-who"></div>
          <div id="hud-objective"></div>
        </div>
        <div id="hud-bars" hidden></div>
        <div id="threats"></div>
        <div id="hud-captions" aria-live="polite"></div>
        <div id="hud-hint"></div>
      </div>
      <div id="screen"></div>
      <div id="debug" hidden></div>
      <noscript>Homewater needs JavaScript and WebGL.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
